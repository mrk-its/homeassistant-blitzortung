# Refuse anonymous subscriptions that cover the whole globe, and fae-relay clients.
# Source: tools/mosquitto_area_limit in the homeassistant-blitzortung repo, also kept in
# /opt/mosquitto-area-limit on the server. Installed by tools/deploy.sh.
# Plugins load only on restart, not on reload.
plugin /usr/lib/x86_64-linux-gnu/mosquitto_area_limit.so
plugin_opt_roots blitzortung/1.1,b/1
plugin_opt_min_levels 1
plugin_opt_deny_client_prefixes fae-relay
