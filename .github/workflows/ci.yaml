name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          enable-cache: true
          activate-environment: true
          python-version: "3.14"

      - name: Install dependencies
        run: uv pip install -r requirements-dev.txt --prerelease=allow

      - name: Lint with ruff
        run: ruff check custom_components/blitzortung

      - name: Check format with ruff
        run: ruff format --check custom_components/blitzortung

      - name: Run prek
        run: |
          prek run \
            end-of-file-fixer \
            trailing-whitespace \
            check-yaml \
            check-json \
            check-toml \
            mixed-line-ending \
            --all-files

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          enable-cache: true
          activate-environment: true
          python-version: "3.14"

      - name: Install dependencies
        run: uv pip install -r requirements-dev.txt --prerelease=allow

      - name: Run tests
        run: pytest tests --cov=custom_components/blitzortung --cov-report=term-missing
