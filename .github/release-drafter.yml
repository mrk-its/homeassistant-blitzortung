name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

change-template: "- #$NUMBER $TITLE @$AUTHOR"
sort-direction: ascending

categories:
  - title: "🚨 Breaking changes"
    semver-increment: "major"
    when:
      label: "breaking-change"

  - title: "✨ New features"
    semver-increment: "minor"
    when:
      label: "new-feature"

  - title: "🐛 Bug fixes"
    semver-increment: "patch"
    when:
      label: "bugfix"

  - title: "🚀 Enhancements"
    semver-increment: "patch"
    when:
      labels:
        - "enhancement"
        - "refactor"
        - "performance"

  - title: "🧰 Maintenance"
    semver-increment: "patch"
    when:
      labels:
        - "maintenance"
        - "ci"
        - "tests"

  - title: "📚 Documentation"
    semver-increment: "patch"
    when:
      labels:
        - "documentation"

  - title: "⬆️ Dependency updates"
    semver-increment: "patch"
    collapse-after: 1
    when:
      labels:
        - "dependencies"

  - type: "version-resolver"
    semver-increment: "patch"

template: |
  [![Downloads for this release](https://img.shields.io/github/downloads/mrk-its/homeassistant-blitzortung/v$RESOLVED_VERSION/total.svg)](https://github.com/mrk-its/homeassistant-blitzortung/releases/v$RESOLVED_VERSION)

  ## What's changed

  $CHANGES
