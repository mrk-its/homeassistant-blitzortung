version: 2
enable-beta-ecosystems: true

multi-ecosystem-groups:
  dev:
    schedule:
      interval: "weekly"

updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      test:
        patterns:
          - "pytest"
          - "pytest-*"
    # Bumped manually as a pair: homeassistant pin + pytest-home-assistant tag
    ignore:
      - dependency-name: "homeassistant"
      - dependency-name: "pytest-home-assistant"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      ci:
        patterns: ["*"]

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      pre-commit:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/"
    patterns:
      - "prek"
      - "ruff"
    multi-ecosystem-group: "dev"

  - package-ecosystem: "pre-commit"
    directory: "/"
    patterns:
      - "*/astral-sh/ruff-pre-commit"
    multi-ecosystem-group: "dev"
