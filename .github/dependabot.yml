version: 2
enable-beta-ecosystems: true

multi-ecosystem-groups:
  dev:
    schedule:
      interval: "weekly"

updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      hass:
        patterns:
          - "pytest-homeassistant"
      test:
        patterns:
          - "pytest"
          - "pytest-*"
        exclude-patterns:
          - "pytest-homeassistant"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      ci:
        patterns: ["*"]

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      pre-commit:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/"
    patterns:
      - "prek"
      - "ruff"
    multi-ecosystem-group: "dev"

  - package-ecosystem: "pre-commit"
    directory: "/"
    patterns:
      - "*/astral-sh/ruff-pre-commit"
    multi-ecosystem-group: "dev"
